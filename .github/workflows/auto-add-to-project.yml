# Auto-add issues + PRs from forgeplan-marketplace to ForgePlan/projects/5.
# Filled-in copy of docs/templates/auto-add-to-project.yml — keep them in sync.
# If you fork this repo or set up a new ForgePlan project, copy the template
# from docs/templates/auto-add-to-project.yml and replace {{PROJECT_URL}}.

name: Auto-add to project

on:
  issues:
    types: [opened, reopened]
  # `pull_request_target`, not `pull_request`: GitHub withholds secrets from workflows triggered by
  # a fork PR, so ADD_TO_PROJECT_PAT arrives empty and the job dies on "Input required and not
  # supplied: github-token". The first external PR (#243) hit exactly that — a red check the
  # contributor had no way to fix, on a PR whose own validation was green.
  #
  # Safe here because this job never fetches the PR's code: there is no `actions/checkout`, and the
  # only input is the PR number from the event payload. The danger of `pull_request_target` is
  # running attacker-controlled code with a write-scoped token; with nothing checked out there is
  # nothing to run. Our own WF-PRT-CHECKOUT rule encodes the same distinction.
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  add-to-project:
    name: Add issue/PR to ForgePlan project 5
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to v2.0.0 — matches repo convention (see validate-plugins.yml).
      # Update SHA when bumping version: gh api repos/actions/add-to-project/git/ref/tags/v2.x.x --jq '.object.sha'
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: 'https://github.com/orgs/ForgePlan/projects/5'
          # GITHUB_TOKEN cannot reach org-level ProjectV2 — verified empirically by PR #53 CI run
          # (error: "Could not resolve to a ProjectV2 with the number 5"). Switched to fine-grained
          # PAT with Organization → Projects (read+write) scope. Secret is repo-level.
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
