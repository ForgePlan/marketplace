# TRAP — must fire WF-PRT-ARTIFACT. The canonical workflow_run artifact-poisoning RCE: no checkout
# step and no fetch verb, so both other privileged rules fall through it. Do not fix.
name: trap artifact poison
on:
  workflow_run:
    workflows: [build]
    types: [completed]
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
      - run: unzip -o pr-build.zip && ./dist/postinstall.sh
