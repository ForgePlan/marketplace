# CAUGHT INCIDENTALLY, not by the rule that should apply.
# The checkout-indirection rule (PR_HEAD_REF) still cannot see this: the untrusted expression is a
# hop away from the `ref:`. What fires is WF-INJECT, because THIS spelling routes the hop through a
# `run:` block, and interpolating untrusted context into a shell block is its own finding.
# Spell the same hop without a shell block — see known-miss/ref-via-github-script.yml — and it slips.
# So the coverage here is a side effect of the shape, not of the class being understood.
# CLASS: indirection in `ref` — via needs output, across jobs
# Both the ref AND the repository come from a previous job, so the checkout targets the fork.
name: miss-ref-via-needs-output
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.x.outputs.rev }}
      repo: ${{ steps.x.outputs.repo }}
    steps:
      - id: x
        run: |
          echo "rev=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.event.pull_request.head.repo.full_name }}" >> "$GITHUB_OUTPUT"
  build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.meta.outputs.rev }}
          repository: ${{ needs.meta.outputs.repo }}
      - run: npm ci && npm test
