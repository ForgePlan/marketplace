# BENIGN — must produce NO HIGH finding. This workflow is push-only and merely NAMES the dangerous
# trigger in a comment explaining why it is not used. A word-match over the raw file reddened it,
# which is how the master-switch fix nearly traded one bug for a worse one. Do not fix.
#
# We deliberately do NOT use pull_request_target here: this job needs no secrets and must never
# check out a contributor branch.
name: benign mentions trigger
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: git fetch --tags && npm ci
