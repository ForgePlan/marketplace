# CLASS: injection — the sink is a docker-action argument
name: miss-inject-docker-args
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://alpine:3.20
        with:
          args: sh -c "echo ${{ github.event.pull_request.body }}"
